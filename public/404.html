<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Aura Router</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f5f3ed; color: #171713; }
      main { width: min(620px, calc(100% - 40px)); }
      p { color: #65645d; font-size: 18px; }
      a { display: inline-block; padding: 10px 15px; border-radius: 10px; background: #e2ad00; color: #171713; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { background: #141512; color: #f3f0e7; } p { color: #aaa89f; } }
    </style>
  </head>
  <body>
    <main>
      <p>404 · Static host response</p>
      <h1>No HTML lives at this URL.</h1>
      <p>No catch-all rewrite, no empty app shell—the static host returned a real 404.</p>
      <a href="/">Return to the demo</a>
    </main>
  </body>
</html>
